<t>
    <t t-call="master_input" />
    <div class="row mb-3">
        <label for="dbname" class="col-md-4 col-form-label">Nome do banco</label>
        <div class="col-md-8">
            <input id="dbname" type="text" name="name" class="form-control" required="required" autocomplete="off" t-att-pattern="pattern" title="Apenas caracteres alfanuméricos, sublinhado, hífen e ponto são permitidos"/>
        </div>
    </div>
    <div class="row mb-3">
        <label for="login" class="col-md-4 col-form-label">E-mail</label>
        <div class="col-md-8">
            <input id="login" type="text" name="login" class="form-control" required="required" autocomplete="off"/>
        </div>
    </div>
    <div class="row mb-3">
        <label for="password" class="col-md-4 col-form-label">Senha</label>
        <div class="col-md-8">
            <div class="input-group">
                <input id="password" type="password" name="password" class="form-control" required="required" autocomplete="off"/>
                <span class="oi o_little_eye input-group-text" data-icon="visibility" aria-hidden="true" style="cursor: pointer;"></span>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <label for="phone" class="col-md-4 col-form-label">Telefone</label>
        <div class="col-md-8">
            <input id="phone" type="tel" name="phone" class="form-control" autocomplete="off"/>
        </div>
    </div>
    <div class="row mb-3">
        <label for="lang" class="col-md-4 col-form-label">Idioma</label>
        <div class="col-md-8">
            <select id="lang" name="lang" class="form-select" required="required" autocomplete="off">
                <t t-foreach="langs" t-as="lang">
                    <t t-if="lang[0] == 'pt_BR'">
                        <option t-att-value="lang[0]" t-out="lang[1]" selected="selected"/>
                    </t>
                    <t t-else="">
                        <option t-att-value="lang[0]" t-out="lang[1]"/>
                    </t>
                </t>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label for="country" class="col-md-4 col-form-label">País</label>
        <div class="col-md-8">
            <select id="country" name="country_code" class="form-select" autocomplete="off">
                <option value=""></option>
                <t t-foreach="countries" t-as="country">
                    <t t-if="country[0] == 'br'">
                        <option t-att-value="country[0]" t-out="country[1]" selected="selected"/>
                    </t>
                    <t t-else="">
                        <option t-att-value="country[0]" t-out="country[1]"/>
                    </t>
                </t>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label for="load_demo_checkbox" class="col-md-4 col-form-label">Dados de demonstração</label>
        <div class="col-md-8">
            <input type="checkbox" id="load_demo_checkbox" class="form-control-sm" name="demo" value="1" />
        </div>
    </div>
</t>
