<t>
    <t t-set="set_master_pwd" t-value="set_master_pwd or False" />
    <t t-set="input_class" t-value="'form-control'" />

    <t t-if="insecure">
        <t t-if="set_master_pwd">
            <input type="hidden" name="master_pwd" class="form-control" value="admin"/>
        </t>
        <t t-else="">
            <div class="alert alert-warning">
                <p>Aviso: o gerenciador de bancos não está protegido. Para protegê-lo, geramos a seguinte senha mestra:</p>
                <p style="text-align: center;"><strong class="generated_master_pwd"></strong></p>
                <p>Você pode alterá-la abaixo. Guarde-a com segurança, pois ela será solicitada em operações futuras.</p>
            </div>
            <t t-set="input_class" t-value="'form-control generated_master_pwd_input'" />
        </t>
    </t>
    <t t-if="not insecure or not set_master_pwd">
        <div class="row mb-3">
            <label for="master_pwd" class="col-md-4 col-form-label">Senha mestra</label>
            <div class="col-md-8">
                <div class="input-group">
                    <input name="master_pwd"
                        t-att-class="input_class"
                        required="required"
                        autofocus="autofocus"
                        type="password"
                        autocomplete="current-password" />
                    <span class="oi o_little_eye input-group-text" data-icon="visibility" aria-hidden="true" style="cursor: pointer;"></span>
                </div>
            </div>
        </div>
    </t>
</t>
