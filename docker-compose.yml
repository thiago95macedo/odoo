# ==============================================================================
# WETH DEV ENVIRONMENT — WETH Development Environment
# ==============================================================================
# Implantação local com Python 3.12 / WETH integrada ao proxy Caddy (weth_proxy_net).
# Upstream esperado no Caddy: weth-app:8069
# Domínio local: https://weth.test
# ==============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: weth-db
    restart: "no"
    environment:
      POSTGRES_USER: weth
      POSTGRES_PASSWORD: "1q2w3e4r"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /home/arcanus/Workspace/dados/weth/postgres:/var/lib/postgresql/data
    networks:
      backend_net:
        aliases:
          - weth-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U weth" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: weth/weth:20.0
    container_name: weth-app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/opt/weth
      - /home/arcanus/Workspace/dados/weth/data:/var/lib/weth
    environment:
      HOST: weth-db
      PORT: 5432
      USER: weth
      PASSWORD: "1q2w3e4r"
    networks:
      weth_proxy_net:
        aliases:
          - weth-app
      backend_net:
    command: [ "/opt/weth/weth-bin", "-c", "/opt/weth/weth.conf" ]

networks:
  weth_proxy_net:
    external: true
  backend_net:
    name: weth_backend_net
    driver: bridge
